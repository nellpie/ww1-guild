<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1008" />
  <title>Birinci Dünya Savaşı - İnteraktif Harita</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0b06;
      --parchment: #c9a96e;
      --parchment-dark: #8b6914;
      --red: #8b1a1a;
      --cream: #f0e6cc;
      --ui-bg: rgba(14, 11, 6, 0.82);
      --border: rgba(201, 169, 110, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Cinzel', serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── MAP ── */
    #map-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
    }
    #map-wrap.grabbing { cursor: grabbing; }

    #map-img {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
      display: block;
    }

    #hitbox-canvas {
      position: absolute;
      top: 0; left: 0;
      cursor: pointer;
      z-index: 10;
    }

    /* ── VIGNETTE ── */
    #vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* ── TOP BAR ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }

    #title-text {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--parchment);
      text-transform: uppercase;
      opacity: 0.7;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }

    /* ── CONTROLS ── */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
      pointer-events: none;
    }

    #type-toggle {
      pointer-events: all;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #type-toggle:active { background: rgba(201,169,110,0.15); }

    #type-icon {
      width: 18px; height: 18px;
      opacity: 0.85;
    }

    #type-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--parchment);
      text-transform: uppercase;
    }

    #year-nav {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .year-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #4fc3f7;
      font-size: 18px;
      transition: background 0.15s;
      border: none;
      background: transparent;
      font-family: 'Cinzel', serif;
    }
    .year-btn:active { background: rgba(79,195,247,0.12); }
    .year-btn:disabled { color: rgba(79,195,247,0.25); cursor: default; }

    #year-sep-l, #year-sep-r {
      width: 1px; height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }

    #year-display {
      width: 72px;
      text-align: center;
      font-family: 'IM Fell English', serif;
      font-size: 22px;
      color: var(--cream);
      letter-spacing: 0.04em;
      line-height: 44px;
    }

    /* ── LOADER ── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.4s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    #loader-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 0.3em;
      color: var(--parchment);
      text-transform: uppercase;
    }

    #loader-bar-wrap {
      width: 140px; height: 2px;
      background: rgba(201,169,110,0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%;
      width: 0%;
      background: var(--parchment);
      border-radius: 2px;
      transition: width 0.3s;
    }

    #map-img { transition: opacity 0.25s; }
    #map-img.fading { opacity: 0; }

    /* ── SMALL POPUP ── */
    #small-popup {
      position: fixed;
      background: var(--ui-bg);
      border: 2px solid var(--parchment);
      border-radius: 8px;
      padding: 16px;
      z-index: 200;
      backdrop-filter: blur(8px);
      display: none;
      max-width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      animation: popupIn 0.3s ease;
    }

    @keyframes popupIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .popup-flag {
      width: 50px;
      height: 33px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .popup-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .popup-country {
      font-size: 16px;
      color: var(--cream);
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    .popup-summary {
      font-size: 12px;
      color: #c9a96e;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .popup-button {
      width: 100%;
      padding: 10px;
      background: var(--red);
      border: none;
      color: var(--cream);
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .popup-button:active { background: var(--parchment-dark); }

    /* ── LARGE POPUP ── */
    #large-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 250;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #large-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--ui-bg);
      border: 2px solid var(--parchment);
      border-radius: 8px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 251;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      display: none;
    }

    .large-popup-title {
      font-size: 20px;
      color: var(--cream);
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .large-popup-content {
      font-size: 13px;
      color: #c9a96e;
      line-height: 1.6;
    }

    .large-popup-content h3 {
      color: var(--parchment);
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .large-popup-content ul {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .large-popup-content li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .close-large-popup {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--parchment);
      font-size: 28px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-text {
      text-align: center;
      color: var(--parchment);
      font-size: 12px;
      padding: 20px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(201,169,110,0.2);
      border-top: 2px solid var(--parchment);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── API KEY MODAL ── */
    #api-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(4px);
    }

    #api-modal {
      background: var(--ui-bg);
      border: 2px solid var(--parchment);
      border-radius: 8px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }

    .api-modal-title {
      font-size: 16px;
      color: var(--cream);
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .api-modal-text {
      font-size: 12px;
      color: #c9a96e;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .api-modal-text a {
      color: var(--parchment);
      text-decoration: underline;
    }

    #api-input {
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--cream);
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    #api-input:focus {
      outline: none;
      border-color: var(--parchment);
    }

    #api-input::placeholder {
      color: #8b7355;
    }

    .api-buttons {
      display: flex;
      gap: 10px;
    }

    .api-btn {
      flex: 1;
      padding: 10px;
      background: var(--red);
      border: none;
      color: var(--cream);
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .api-btn:active { background: var(--parchment-dark); }

    .api-btn-secondary {
      background: rgba(201,169,110,0.2);
      border: 1px solid var(--parchment);
      color: var(--parchment);
    }

    .api-btn-secondary:active { background: rgba(201,169,110,0.35); }

    @media (max-width: 768px) {
      #large-popup {
        width: 95%;
        max-height: 70vh;
      }
      #small-popup {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div id="loader-title">WWI · 1914–1918</div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<!-- Vignette -->
<div id="vignette"></div>

<!-- Map -->
<div id="map-wrap">
  <img id="map-img" src="" alt="map" draggable="false" />
  <canvas id="hitbox-canvas"></canvas>
</div>

<!-- Top Bar -->
<div id="top-bar">
  <span id="title-text">Birinci Dünya Savaşı</span>
</div>

<!-- Controls -->
<div id="controls">
  <div id="type-toggle" role="button" aria-label="Harita türünü değiştir">
    <svg id="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--parchment)">
      <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
    <span id="type-label">Ülke Sınırları</span>
  </div>

  <div id="year-nav">
    <button class="year-btn" id="btn-prev" aria-label="Önceki yıl">&#8249;</button>
    <div id="year-sep-l"></div>
    <div id="year-display">1914</div>
    <div id="year-sep-r"></div>
    <button class="year-btn" id="btn-next" aria-label="Sonraki yıl">&#8250;</button>
  </div>
</div>

<!-- Small Popup -->
<div id="small-popup">
  <div class="popup-flag">
    <img id="popup-flag" src="" alt="flag" style="display:none;">
  </div>
  <div class="popup-country" id="popup-country">Ülke Adı</div>
  <div class="popup-summary" id="popup-summary">Kısa özet</div>
  <button class="popup-button" onclick="openLargePopup()">Devamı</button>
</div>

<!-- Large Popup Overlay -->
<div id="large-popup-overlay" onclick="closeLargePopup()"></div>

<!-- Large Popup -->
<div id="large-popup">
  <button class="close-large-popup" onclick="closeLargePopup()">×</button>
  <div class="large-popup-title" id="large-title">Ülke Adı</div>
  <div class="large-popup-content" id="large-content">
    <div class="loading-text">
      <div class="spinner"></div>
      <p>Bilgi yükleniyor...</p>
    </div>
  </div>
</div>

<!-- API Key Modal -->
<div id="api-modal-overlay">
  <div id="api-modal">
    <div class="api-modal-title">API Anahtarı Gerekli</div>
    <div class="api-modal-text">
      Claude AI'den detaylı ülke bilgilerini almak için Anthropic API anahtarı gerekli.
      <a href="https://console.anthropic.com/keys" target="_blank">console.anthropic.com</a> adresinden alabilirsin.
    </div>
    <input id="api-input" type="password" placeholder="sk-ant-..." onkeypress="if(event.key==='Enter') saveApiKey()">
    <div class="api-buttons">
      <button class="api-btn" onclick="saveApiKey()">Kaydet</button>
      <button class="api-btn api-btn-secondary" onclick="skipApiKey()">Sonra</button>
    </div>
  </div>
</div>

<script>
  // CONFIG
  const YEARS = [1914, 1915, 1916, 1917, 1918];
  const TYPES = ['country', 'alliance'];
  const TYPE_LABELS = { country: 'Ülke Sınırları', alliance: 'İttifak Haritası' };
  const MAP_DIR = '/ww1-guild/maps/';
  const HITBOXES_FILE = '/ww1-guild/hitboxes_merged.json';

  // STATE
  let yearIdx = 0;
  let typeIdx = 0;
  let hitboxData = null;
  let selectedCountry = null;
  let scale = 1, ox = 0, oy = 0;
  let imgW = 0, imgH = 0;
  let minScale = 1;

  const img = document.getElementById('map-img');
  const canvas = document.getElementById('hitbox-canvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('map-wrap');
  const yearEl = document.getElementById('year-display');
  const typeLabel = document.getElementById('type-label');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const loader = document.getElementById('loader');
  const loaderBar = document.getElementById('loader-bar');

  // ── HELPERS ──
  function mapSrc(year, type) {
    return `${MAP_DIR}${year}_${type}.jpg`;
  }

  function clampOffset(x, y, s) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = imgW * s, ih = imgH * s;
    const minX = iw > vw ? vw - iw : (vw - iw) / 2;
    const minY = ih > vh ? vh - ih : (vh - ih) / 2;
    const maxX = iw > vw ? 0 : (vw - iw) / 2;
    const maxY = ih > vh ? 0 : (vh - ih) / 2;
    return {
      x: Math.min(maxX, Math.max(minX, x)),
      y: Math.min(maxY, Math.max(minY, y))
    };
  }

  function applyTransform(x, y, s) {
    const c = clampOffset(x, y, s);
    ox = c.x; oy = c.y; scale = s;
    img.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    canvas.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
  }

  function fitToScreen() {
    if (!imgW || !imgH) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.max(vw / imgW, vh / imgH);
    minScale = s;
    const cx = (vw - imgW * s) / 2;
    const cy = (vh - imgH * s) / 2;
    applyTransform(cx, cy, s);
  }

  // ── LOAD DATA ──
  async function loadHitboxes() {
    try {
      const response = await fetch(HITBOXES_FILE);
      if (!response.ok) throw new Error('Hitboxes bulunamadı');
      hitboxData = await response.json();
    } catch (error) {
      console.error('Hitboxes yüklenemedi:', error);
    }
  }

  // ── POINT IN POLYGON ──
  function isPointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      let xi = points[i].x, yi = points[i].y;
      let xj = points[j].x, yj = points[j].y;
      let intersect = ((yi > y) !== (yj > y))
        && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // ── CANVAS CLICK ──
  canvas.addEventListener('click', (e) => {
    if (!hitboxData) return;
    
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left - ox) / scale;
    const y = (e.clientY - rect.top - oy) / scale;

    const year = YEARS[yearIdx].toString();
    const countriesForYear = hitboxData.countries.filter(c => c.year === year);

    for (let country of countriesForYear) {
      if (country.points && isPointInPolygon(x, y, country.points)) {
        selectedCountry = country;
        showSmallPopup(country, e.clientX, e.clientY);
        return;
      }
    }
  });

  // ── POPUP FUNCTIONS ──
  async function showSmallPopup(country, clientX, clientY) {
    const popup = document.getElementById('small-popup');
    
    // Set content
    document.getElementById('popup-country').textContent = country.name;
    document.getElementById('popup-summary').textContent = 'Bilgi yükleniyor...';
    
    // Get flag
    const flagUrl = await getWikipediaFlag(country.name);
    const flagImg = document.getElementById('popup-flag');
    if (flagUrl) {
      flagImg.src = flagUrl;
      flagImg.style.display = 'block';
    } else {
      flagImg.style.display = 'none';
    }
    
    // Get summary
    const summary = await getCountrySummary(country.name, country.year);
    document.getElementById('popup-summary').textContent = summary;
    
    // Position popup
    let left = clientX + 15;
    let top = clientY + 15;
    if (left + 320 > window.innerWidth) left = clientX - 335;
    if (top + 200 > window.innerHeight) top = clientY - 215;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    popup.style.display = 'block';
  }

  function closeLargePopup() {
    document.getElementById('large-popup-overlay').style.display = 'none';
    document.getElementById('large-popup').style.display = 'none';
  }

  async function openLargePopup() {
    if (!selectedCountry) return;
    
    document.getElementById('large-popup-overlay').style.display = 'flex';
    document.getElementById('large-popup').style.display = 'block';
    document.getElementById('large-title').textContent = selectedCountry.name;
    
    const content = document.getElementById('large-content');
    content.innerHTML = '<div class="loading-text"><div class="spinner"></div><p>Bilgi yükleniyor...</p></div>';
    
    const detailedInfo = await getDetailedCountryInfo(selectedCountry.name, selectedCountry.year);
    content.innerHTML = detailedInfo;
  }

  // ── API FUNCTIONS ──
  async function getWikipediaFlag(countryName) {
    try {
      const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(countryName)}`);
      if (!response.ok) return null;
      const data = await response.json();
      return data.thumbnail?.url || null;
    } catch (error) {
      return null;
    }
  }

  async function getCountrySummary(countryName, year) {
    const apiKey = localStorage.getItem('ww1_api_key');
    if (!apiKey) return 'Ülke bilgisi';

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-20250805',
          max_tokens: 100,
          messages: [{
            role: 'user',
            content: `${countryName} ülkesinin WWI sırasında ${year} yılındaki rolünü 1 cümlede özetle (örn: "İttifak Devleti", "Tarafsız", vb.). Maksimum 10 kelime.`
          }]
        })
      });

      if (!response.ok) return 'Ülke bilgisi';
      const data = await response.json();
      return data.content[0]?.text || 'Ülke bilgisi';
    } catch (error) {
      return 'Ülke bilgisi';
    }
  }

  async function getDetailedCountryInfo(countryName, year) {
    const apiKey = localStorage.getItem('ww1_api_key');
    if (!apiKey) {
      return '<div style="color: #c9a96e;">API anahtarı ayarlanmamış. Detaylı bilgi alamıyorum.</div>';
    }

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-20250805',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `${countryName} ülkesinin Birinci Dünya Savaşında ${year} yılındaki durumunu çok detaylı ve maddeli olarak açıkla. Şu başlıkları eklemelisin:
- Savaşa Katılımı/Tarafsızlığı
- Müttefikleri
- Ana Cepheleri
- Kayıpları ve Zaferler
- Ekonomik Durumu
- Savaş Sonrası Etkileri

Her başlık için 2-3 madde yazma. Türkçe olsun.`
          }]
        })
      });

      if (!response.ok) return '<div style="color: #c9a96e;">Bilgi yüklenemedi.</div>';
      const data = await response.json();
      let text = data.content[0]?.text || 'Bilgi yüklenemedi.';
      
      // Format to HTML
      text = text.replace(/###\s+(.+?)$/gm, '<h3>$1</h3>');
      text = text.replace(/\*\*(.+?):\**/g, '<strong>$1:</strong>');
      text = text.replace(/\n/g, '<br>');
      text = text.replace(/- /g, '• ');
      
      return `<div style="color: #c9a96e;">${text}</div>`;
    } catch (error) {
      return `<div style="color: #c9a96e;">Hata: ${error.message}</div>`;
    }
  }

  // ── API KEY MODAL ──
  function saveApiKey() {
    const key = document.getElementById('api-input').value.trim();
    if (!key) {
      alert('Lütfen API anahtarı gir');
      return;
    }
    if (!key.startsWith('sk-ant-')) {
      alert('Geçersiz anahtar format');
      return;
    }
    localStorage.setItem('ww1_api_key', key);
    document.getElementById('api-modal-overlay').style.display = 'none';
  }

  function skipApiKey() {
    document.getElementById('api-modal-overlay').style.display = 'none';
  }

  // ── MAP LOADING ──
  function showMap(year, type, animate) {
    const src = mapSrc(year, type);
    if (animate) img.classList.add('fading');
    setTimeout(() => {
      img.src = src;
      img.onload = () => {
        if (!imgW) {
          imgW = img.naturalWidth;
          imgH = img.naturalHeight;
          img.style.width = imgW + 'px';
          img.style.height = imgH + 'px';
          canvas.width = imgW;
          canvas.height = imgH;
          fitToScreen();
          loader.classList.add('hidden');
        }
        img.classList.remove('fading');
      };
    }, animate ? 150 : 0);
  }

  function updateUI() {
    const year = YEARS[yearIdx];
    const type = TYPES[typeIdx];
    yearEl.textContent = year;
    typeLabel.textContent = TYPE_LABELS[type];
    btnPrev.disabled = yearIdx === 0;
    btnNext.disabled = yearIdx === YEARS.length - 1;
    showMap(year, type, true);
  }

  // ── CONTROLS ──
  btnPrev.addEventListener('click', () => {
    if (yearIdx > 0) { yearIdx--; updateUI(); }
  });
  btnNext.addEventListener('click', () => {
    if (yearIdx < YEARS.length - 1) { yearIdx++; updateUI(); }
  });
  document.getElementById('type-toggle').addEventListener('click', () => {
    typeIdx = (typeIdx + 1) % TYPES.length;
    updateUI();
  });

  // ── TOUCH & MOUSE ──
  let lastTouches = null, panStart = null;

  function getTouchMidpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }
  function getTouchDist(t1, t2) {
    const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  wrap.addEventListener('touchstart', e => {
    e.preventDefault();
    lastTouches = Array.from(e.touches);
    if (e.touches.length === 1) {
      panStart = { ox, oy, cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    }
    wrap.classList.add('grabbing');
  }, { passive: false });

  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    const touches = Array.from(e.touches);
    if (touches.length === 1 && panStart) {
      const dx = touches[0].clientX - panStart.cx;
      const dy = touches[0].clientY - panStart.cy;
      applyTransform(panStart.ox + dx, panStart.oy + dy, scale);
    } else if (touches.length === 2 && lastTouches.length >= 2) {
      const prevDist = getTouchDist(lastTouches[0], lastTouches[1]);
      const newDist = getTouchDist(touches[0], touches[1]);
      const factor = newDist / prevDist;
      const mid = getTouchMidpoint(touches[0], touches[1]);
      const newScale = Math.min(Math.max(scale * factor, minScale), minScale * 12);
      const nx = mid.x - (mid.x - ox) * (newScale / scale);
      const ny = mid.y - (mid.y - oy) * (newScale / scale);
      applyTransform(nx, ny, newScale);
      const prevMid = getTouchMidpoint(lastTouches[0], lastTouches[1]);
      applyTransform(ox + mid.x - prevMid.x, oy + mid.y - prevMid.y, scale);
    }
    lastTouches = touches;
  }, { passive: false });

  wrap.addEventListener('touchend', e => {
    e.preventDefault();
    lastTouches = Array.from(e.touches);
    if (e.touches.length === 0) {
      wrap.classList.remove('grabbing');
      panStart = null;
    } else if (e.touches.length === 1) {
      panStart = { ox, oy, cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    }
  }, { passive: false });

  let mouseDown = false, mStart = null;
  wrap.addEventListener('mousedown', e => {
    mouseDown = true;
    mStart = { ox, oy, cx: e.clientX, cy: e.clientY };
    wrap.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!mouseDown || !mStart) return;
    applyTransform(mStart.ox + e.clientX - mStart.cx, mStart.oy + e.clientY - mStart.cy, scale);
  });
  window.addEventListener('mouseup', () => { mouseDown = false; wrap.classList.remove('grabbing'); });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const newScale = Math.min(Math.max(scale * factor, minScale), minScale * 12);
    const nx = e.clientX - (e.clientX - ox) * (newScale / scale);
    const ny = e.clientY - (e.clientY - oy) * (newScale / scale);
    applyTransform(nx, ny, newScale);
  }, { passive: false });

  let lastTap = 0;
  wrap.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) fitToScreen();
    lastTap = now;
  });

  window.addEventListener('resize', fitToScreen);

  // ── INIT ──
  async function init() {
    // Check API key
    const hasApiKey = localStorage.getItem('ww1_api_key');
    if (!hasApiKey) {
      document.getElementById('api-modal-overlay').style.display = 'flex';
    }

    await loadHitboxes();
    
    img.src = mapSrc(YEARS[0], TYPES[0]);
    img.onload = () => {
      imgW = img.naturalWidth;
      imgH = img.naturalHeight;
      img.style.width = imgW + 'px';
      img.style.height = imgH + 'px';
      canvas.width = imgW;
      canvas.height = imgH;
      fitToScreen();
      loader.classList.add('hidden');
      YEARS.forEach(y => TYPES.forEach(t => {
        if (!(y === 1914 && t === 'country')) {
          const i = new Image();
          i.src = mapSrc(y, t);
        }
      }));
    };
    img.onerror = () => {
      loader.classList.add('hidden');
    };

    updateUI();
  }

  init();
</script>
